services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: geotwin-postgis
    environment:
      POSTGRES_USER: geotwin_user
      POSTGRES_PASSWORD: geotwin_password
      POSTGRES_DB: geotwin_db
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # Mount the whole schema directory: Postgres runs every *.sql in
      # lexical order, so the 01_.. 06_ prefixes define the execution order.
      # Mounting a single file (the previous behaviour) silently skipped
      # building_energy_history, ai_insights, the ingestion tables and the
      # spatial context schema on a fresh volume.
      - ./db:/docker-entrypoint-initdb.d:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotwin_user -d geotwin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- FIWARE stack: opt in with `docker compose --profile fiware up` ---------
  #
  # Orion-LD, its MongoDB and the MQTT broker are the NGSI-LD context-broker
  # path. They are not needed to build the dataset, run the experiments, serve
  # the model or view the dashboard, and left running they cost ~365 MB and
  # ~26% CPU producing notifications that the AI service discards -- the
  # entities registered in Orion are leftovers from the removed simulation and
  # match no BDG2 building. Kept, behind a profile, because NGSI-LD Smart Data
  # Model compatibility is a real property worth being able to demonstrate.
  mongo:
    image: mongo:4.4
    container_name: geotwin-mongo
    profiles: ["fiware"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  orion-ld:
    image: fiware/orion-ld
    container_name: geotwin-orion-ld
    profiles: ["fiware"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "1026:1026"
    command: -dbhost mongo
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: geotwin-mosquitto
    profiles: ["fiware"]
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always

  ai-service:
    build: ./ai-service
    container_name: geotwin-ai-service
    depends_on:
      # Only PostGIS is required. The FIWARE services are optional (see the
      # profile above); the service degrades to "no broker" rather than
      # refusing to start.
      postgis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
      # Read-only so results can record the commit that produced them. The
      # image has no git binary; app/provenance.py reads these files directly.
      - ./.git:/repo/.git:ro
    environment:
      - ORION_LD_URL=http://orion-ld:1026/ngsi-ld/v1
      - MQTT_BROKER=mosquitto
      - DB_HOST=postgis
      - DB_PORT=5432
      - DB_NAME=geotwin_db
      - DB_USER=geotwin_user
      - DB_PASS=geotwin_password
    restart: always

  frontend:
    build: ./frontend
    container_name: geotwin-frontend
    depends_on:
      - ai-service
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    restart: always

volumes:
  postgis_data:
  mongo_data:
