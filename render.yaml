version: "1"

services:
  - type: web
    name: geotwin-ai-service
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python init_render_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.11"

  - type: web
    name: geotwin-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_AI_URL
        fromService:
          type: web
          name: geotwin-ai-service
          envVarKey: RENDER_EXTERNAL_URL
